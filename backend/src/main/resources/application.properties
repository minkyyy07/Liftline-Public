spring.application.name=liftline
server.port=8080

# Production database configuration.
# Explicit values must be supplied via environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
# For local development with in-memory H2, activate the 'dev' profile (--spring.profiles.active=dev).
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT secret must be supplied externally via JWT_SECRET (minimum 32 bytes)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

logging.level.org.springframework.security=INFO
logging.level.com.liftline=DEBUG
