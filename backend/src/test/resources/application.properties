spring.application.name=liftline-test

spring.datasource.url=jdbc:h2:mem:liftline_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Test-specific JWT secret of at least 32 bytes (256 bits)
jwt.secret=test-secret-key-liftline-auth-backend-at-least-32-bytes
jwt.expiration-ms=86400000
